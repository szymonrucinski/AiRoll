[package]
name = "shot-classifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
tract-onnx = "0.21"
# force the JS backend for any getrandom use pulled in transitively (wasm has no /dev/urandom)
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
